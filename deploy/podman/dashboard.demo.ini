; ============================================================================
;  KONFIGURASI DEMO PODMAN - JANGAN DIPAKAI DI PRODUKSI
;
;  Dashboard mulai tanpa site. Tambahkan site lewat menu "Site", misalnya:
;    Nama: Jakarta | Master: 192.168.101.11 | Slave: 192.168.101.12
;    Nama: Bandung | Master: 192.168.102.11 | Slave: 192.168.102.12
;    Nama: Surabaya| Master: 192.168.103.11 | Slave: 192.168.103.12
;  Medan sengaja tidak punya schema agar terlihat offline:
;    Nama: Medan   | Master: 192.169.101.11 | Slave: 192.169.101.12
;
;  Schema otomatis: _rep_jakarta, _rep_bandung, _rep_surabaya, _rep_medan.
;  Semua site memakai satu MariaDB demo (host "db").
; ============================================================================

[general]
display_time_zone = "Asia/Jakarta"

[dashboard]
title = "Replicator Demo Multi-Site"
refresh_sec = 15
stale_after_sec = 120
page_size = 50

; Preview lokal: autentikasi dimatikan agar mudah diperiksa.
; Di produksi WAJIB basic_auth = "true".
basic_auth = "false"
username = "admin"
password = ""

db_host = "db"
db_port = 3306
db_user = "repl_dashboard"
db_password = "DemoDashboard2026!"
local_status_file = ""

; Site demo dikelola dari halaman Site dan disimpan di dalam container.
allow_site_management = "true"
sites_file = "sites.ini"
