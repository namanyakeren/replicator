; ============================================================================
;  REPLICATOR DASHBOARD - KONFIGURASI DASHBOARD (PHP)
;  Salin file ini menjadi  config\dashboard.ini  lalu sesuaikan nilainya.
;
;  File ini HANYA dibaca oleh dashboard PHP. Agent tidak memakai file ini.
;  Satu dashboard dapat memantau banyak site. Site ditambahkan lewat halaman
;  "Site" di dashboard dan disimpan di file terpisah (sites_file).
;
;  Format INI sederhana:
;    - komentar diawali ";" atau "#"
;    - satu baris satu pasangan  key = value
;    - nilai teks sebaiknya diapit tanda kutip dua ("...")
;    - jangan memakai komentar di belakang nilai (inline comment)
; ============================================================================

[general]
; Zona waktu tampilan. Data status di MySQL selalu UTC.
display_time_zone = "Asia/Jakarta"


; ----------------------------------------------------------------------------
; PENGATURAN UMUM DASHBOARD
; ----------------------------------------------------------------------------
[dashboard]
title = "Monitoring Replikasi Multi-Site"
refresh_sec = 15
; Heartbeat dianggap basi (agent mati/hang/jaringan putus) setelah N detik.
stale_after_sec = 120
page_size = 50

basic_auth = "true"
username = "admin"
password = "GANTI_PASSWORD_DASHBOARD"

; Izinkan halaman Site menambah/menghapus site.
; File sites_file harus bisa ditulis user web server.
allow_site_management = "true"
; Kosongkan nilainya untuk memakai sites.ini di folder config yang sama.
; Path relatif dihitung dari folder file dashboard.ini ini.
sites_file = "sites.ini"

; Koneksi database status default untuk semua site.
; Nilai ini dipakai bila site tidak mengisi db_host/db_user.
;
; Mode langsung (status di tiap backup):
;   db_host = ""            -> ikuti backup_host masing-masing site
;   db_user = "repl_dashboard"
;
; Mode pusat (semua status di satu MySQL):
;   db_host = "10.10.10.5"
;   db_port = 3306
;   db_user = "repl_dashboard"
; Schema status per site diisi otomatis (_rep_<id>); tabelnya dibuat agent
; saat siklus pertama.
db_host = ""
db_port = 0
db_user = "repl_dashboard"
db_password = "GANTI_PASSWORD_DASHBOARD_DB"

; Opsional: path file status JSON agent untuk diagnosa lokal.
; Kosongkan jika dashboard berada di mesin yang berbeda.
local_status_file = ""


; ----------------------------------------------------------------------------
; CATATAN SITE
;
; Tidak ada site yang ditulis di file ini. Buka dashboard, masuk ke menu
; "Site", lalu isi IP master dan IP slave. Dashboard membuat section
; [site:<id>] di sites_file beserta schema status otomatis.
;
; Contoh hasil untuk site Jakarta:
;   [site:jakarta]
;   name = "Jakarta"
;   master_host = "192.168.101.11"
;   backup_host = "192.168.101.12"
;   status_schema = "_rep_jakarta"
;
; Schema itu WAJIB dipakai agent di site tersebut:
;   [status]
;   schema = "_rep_jakarta"
;
; Bila ingin mendefinisikan site secara manual, tambahkan [site:<id>] di file
; ini; site tersebut tetap tampil, tetapi tidak bisa dihapus lewat halaman Site.
; ----------------------------------------------------------------------------


; ----------------------------------------------------------------------------
; CATATAN KEAMANAN
; - Gunakan user MySQL dashboard yang hanya punya SELECT pada schema _rep*.
; - Jangan menaruh file ini di document root. Document root harus dashboard\.
; - Beri izin tulis hanya pada sites_file, bukan seluruh folder config bila bisa.
; - Aktifkan HTTPS atau akses dashboard hanya lewat VPN.
; - Ganti semua nilai GANTI_... sebelum dashboard dibuka.
; ----------------------------------------------------------------------------
