[package]
name = "replicator-agent"
version = "1.0.0"
edition = "2021"
rust-version = "1.77"
description = "Agent sinkronisasi database MySQL untuk Windows 7-11"
license = "MIT"

[dependencies]
mysql = { version = "=24.0.0", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
ctrlc = "=3.4.5"
chrono = { version = "=0.4.39", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
