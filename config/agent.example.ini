; ============================================================================
;  REPLICATOR AGENT - KONFIGURASI AGENT (WINDOWS)
;  Salin file ini menjadi  config\agent.ini  lalu sesuaikan nilainya.
;
;  File ini HANYA dibaca oleh replicator-agent.exe. Dashboard tidak memakai
;  file ini; konfigurasi dashboard ada di config\dashboard.ini.
;
;  Format INI sederhana:
;    - komentar diawali ";" atau "#"
;    - satu baris satu pasangan  key = value
;    - nilai teks sebaiknya diapit tanda kutip dua ("...")
;    - jangan memakai komentar di belakang nilai (inline comment)
;
;  Path relatif dihitung dari folder tempat file ini berada (config\).
; ============================================================================

[general]
; Zona waktu untuk tampilan/status file. Data status di MySQL disimpan UTC.
display_time_zone = "Asia/Jakarta"


; ----------------------------------------------------------------------------
; IDENTITAS AGENT
; ----------------------------------------------------------------------------
[agent]
; Nama unik agent. Kosongkan untuk otomatis: NAMAKOMPUTER-agent.
; Saat memakai database status pusat, gunakan ID yang unik per site,
; misalnya "site-jakarta".
id = ""

; Ringkasan status terakhir dalam bentuk JSON (untuk diagnosa lokal).
; Kosongkan untuk menonaktifkan.
status_file = "logs/status.json"


; ----------------------------------------------------------------------------
; LOG FILE AGENT
; ----------------------------------------------------------------------------
[logging]
dir = "logs"
level = "info"
max_size_mb = 10
max_files = 5


; ----------------------------------------------------------------------------
; DATABASE MASTER (SUMBER)
; ----------------------------------------------------------------------------
[master]
; Di site remote, alamat ini adalah IP VPN master, misalnya 192.168.101.11.
; Dari dalam LAN site tetap 192.168.1.11.
host = "192.168.1.11"
port = 3306
user = "repl_agent"
password = "GANTI_PASSWORD_MASTER"
database = "appdb"
; Gunakan "utf8mb4" untuk MySQL 5.5+ dan "utf8" untuk MySQL 5.0/5.1.
charset = "utf8mb4"
; Zona waktu sesi. Harus sama di master dan backup agar kolom TIMESTAMP akurat.
time_zone = "+00:00"
connect_timeout_sec = 10
; 0 = tanpa batas waktu baca (aman untuk tabel besar).
read_timeout_sec = 0
tcp_keepalive_sec = 60


; ----------------------------------------------------------------------------
; DATABASE BACKUP (TUJUAN)
; ----------------------------------------------------------------------------
[backup]
host = "192.168.1.12"
port = 3306
user = "repl_agent"
password = "GANTI_PASSWORD_BACKUP"
database = "appdb"
charset = "utf8mb4"
time_zone = "+00:00"
connect_timeout_sec = 10
read_timeout_sec = 0
tcp_keepalive_sec = 60
; Buat database tujuan otomatis jika belum ada.
create_database = "true"


; ----------------------------------------------------------------------------
; PERILAKU SINKRONISASI
; ----------------------------------------------------------------------------
[sync]
; Jeda antar siklus (detik). Semakin kecil, semakin dekat ke real-time.
interval_sec = 30

; Filter tabel. Pisahkan dengan koma. Mendukung wildcard * dan ?.
; Contoh: "users, orders, log_*"
include_tables = "*"
exclude_tables = ""

; auto   = kolom baru di master ditambahkan otomatis ke backup
; strict = perubahan struktur dilaporkan sebagai error, tabel dilewati
schema_mode = "auto"

; true = jika tipe/kolom berubah, tabel di-DROP lalu dibuat ulang + full load.
; false = tabel bermasalah dilewati dan error tampil di dashboard.
recreate_on_drift = "false"

; Jumlah baris per batch INSERT.
full_load_batch_rows = 500
incremental_batch_rows = 1000

; Saat memakai kolom updated_at, baca ulang data selama N detik terakhir.
incremental_overlap_sec = 120

; Matikan pemeriksaan foreign key selama menulis ke backup.
disable_fk_checks = "true"

; Kosongkan tabel tujuan sebelum full load.
; Tabel tanpa primary key/unique key selalu dikosongkan karena tidak bisa di-upsert.
truncate_before_full_load = "true"

; Nama kolom yang dipakai untuk mendeteksi UPDATE (dipilih yang ada di tabel).
updated_column_candidates = "updated_at, updated_on, modified_at, modified_on, last_update, last_updated, mtime"


; ----------------------------------------------------------------------------
; VERIFIKASI KONSISTENSI
; Membandingkan jumlah baris + checksum isi tabel antara master dan backup.
; Deteksi baris yang terhapus di master. Jika berbeda, tabel di-full-load ulang.
; ----------------------------------------------------------------------------
[verify]
enabled = "true"
interval_sec = 300
; Lewati verifikasi untuk tabel dengan perkiraan baris di atas nilai ini.
; 0 = verifikasi semua tabel.
max_rows = 0


; ----------------------------------------------------------------------------
; STATUS / HEARTBEAT UNTUK DASHBOARD
;
; DEFAULT (tanpa override): status ditulis ke schema khusus di database backup.
; Schema default "_rep" aman karena setiap site punya database sendiri.
;
; MODE PUSAT: isi host/port/user/password di bawah dengan database status pusat.
; Setiap agent WAJIB memakai schema berbeda, misalnya:
;   site jakarta -> schema = "_rep_jakarta"
;   site bandung -> schema = "_rep_bandung"
; Host/port/user kosong = ikuti [backup]. Password kosong diwarisi dari [backup]
; hanya bila user-nya juga sama; bila user diganti, isi password-nya sendiri.
; ----------------------------------------------------------------------------
[status]
schema = "_rep"

host = ""
port = 0
user = ""
password = ""
charset = "utf8mb4"
time_zone = "+00:00"
connect_timeout_sec = 10
read_timeout_sec = 0
tcp_keepalive_sec = 60

; Tulis heartbeat minimal setiap N detik (agar tabel besar tidak terlihat mati).
heartbeat_write_sec = 5
event_retention_days = 30
; Jumlah riwayat siklus yang disimpan.
cycle_history_rows = 500


; ----------------------------------------------------------------------------
; NOTIFIKASI (OPSIONAL)
; Perintah dijalankan saat status berubah menjadi error / pulih.
; Variabel lingkungan REP_LEVEL, REP_MESSAGE, REP_AGENT, REP_STATE berisi detail.
; Contoh Windows:
;   command = "powershell -NoProfile -ExecutionPolicy Bypass -Command \"Invoke-WebRequest -Uri 'http://10.0.0.5:8080/hook' -Method POST -Body $env:REP_MESSAGE\""
; ----------------------------------------------------------------------------
[notify]
command = ""
cooldown_sec = 300
