name: replicator-dashboard

services:
  dashboard:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: replicator-dashboard:local
    restart: unless-stopped
    ports:
      # Atur DASHBOARD_PORT dan DASHBOARD_BIND di deploy/docker/.env.
      - "${DASHBOARD_BIND:-127.0.0.1}:${DASHBOARD_PORT:-8080}:80"
    volumes:
      # Folder lokal menyimpan dashboard.ini (rahasia) dan sites.ini (ditulis PHP).
      - ./config:/var/www/config
